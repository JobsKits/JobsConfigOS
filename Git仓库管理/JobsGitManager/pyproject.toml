[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-git-manager"
version = "1.0.1"
description = "Cross-platform desktop manager for nested Git repositories"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6-Essentials==6.12.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.scripts]
jobs-git-manager = "jobs_git_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobs_git_manager = ["assets/*.svg", "assets/SOURCES.txt"]
